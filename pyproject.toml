[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "apps/cloud/backend/alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "I001"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true
exclude = [
    "^apps/cloud/backend/tests/",
]
