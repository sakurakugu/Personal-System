[alembic]
script_location = alembic
# 将项目根目录加入 sys.path，保证容器内直接执行 `alembic` CLI 时能 import app（无需手动设置 PYTHONPATH）
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+asyncpg://bloguser:change_me_in_production@127.0.0.1:15432/blogdb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
