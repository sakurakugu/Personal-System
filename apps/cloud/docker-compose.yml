name: personal-system

services:
  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18 起官方镜像建议挂载到 /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:8.6.3-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (兼容 S3 的文件存储) ────────────────
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000" # MinIO API 端口
      - "127.0.0.1:9001:9001" # MinIO 控制台端口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 后端 (FastAPI) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      APP_TIMEZONE: Asia/Shanghai
    volumes:
      - ./frontend/public/banner:/app/banner:ro
      - twikoodata:/app/twikoo-data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Twikoo（评论服务） ─────────────────────────────
  twikoo:
    image: imaegoo/twikoo
    restart: unless-stopped
    environment:
      TWIKOO_THROTTLE: 250
      TZ: Asia/Shanghai
    volumes:
      - twikoodata:/app/data
    ports:
      - "127.0.0.1:8001:8080"

  # ── 前端 (Vue 3 - 容器内通过 nginx 托管静态文件) ────
  frontend:
    build:
      context: ../..
      dockerfile: apps/cloud/frontend/Dockerfile
      args:
        VITE_TWIKOO_ENV_ID: ${VITE_TWIKOO_ENV_ID:-}
        VITE_TWIKOO_REGION: ${VITE_TWIKOO_REGION:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

  # ── Caddy (反向代理 + 自动 HTTPS 证书) ──────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - backend
      - frontend
      - twikoo

volumes:
  pgdata:
  redisdata:
  miniodata:
  twikoodata:
  caddydata:
  caddyconfig:
