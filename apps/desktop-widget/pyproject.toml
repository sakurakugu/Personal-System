[project]
name = "personal-system-desktop-widget"
version = "0.1.0"
description = "Personal System Qt 桌面小工具"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "keyring>=25.7,<26",
  "PySide6>=6.9,<7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
pretty = true
