# ── www.sakurakugu.top ────────────────────────────────────
# Serves Vue 3 SPA (frontend container)

server {
    listen 80;
    server_name www.sakurakugu.top sakurakugu.top;

    # Redirect to HTTPS (uncomment after SSL cert is set up)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Uncomment after certbot generates certificates:
server {
    listen 443 ssl http2;
    server_name www.sakurakugu.top sakurakugu.top;

    ssl_certificate /etc/letsencrypt/live/sakurakugu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakurakugu.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ── api.sakurakugu.top ───────────────────────────────────
# Reverse proxy to FastAPI backend

server {
    listen 80;
    server_name api.sakurakugu.top;

    # Redirect to HTTPS (uncomment after SSL cert is set up)
    # return 301 https://$host$request_uri;

    client_max_body_size 12M;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Uncomment after certbot generates certificates:
server {
    listen 443 ssl http2;
    server_name api.sakurakugu.top;

    ssl_certificate /etc/letsencrypt/live/sakurakugu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakurakugu.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 12M;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
