# ── sakurakugu.top -> www.sakurakugu.top ────────────────
# 裸域统一 301 到 www，避免主域名分裂

server {
    listen 80;
    server_name sakurakugu.top;

    return 301 http://www.sakurakugu.top$request_uri;
}

server {
    listen 443 ssl;
    http2 on; # Nginx 1.29 起改用独立指令启用 HTTP/2
    server_name sakurakugu.top;

    ssl_certificate /etc/letsencrypt/live/sakurakugu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakurakugu.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://www.sakurakugu.top$request_uri;
}

# ── www.sakurakugu.top ────────────────────────────────────
# 提供 Vue 3 SPA（frontend 容器）

server {
    listen 80;
    server_name www.sakurakugu.top;

    # Redirect to HTTPS (uncomment after SSL cert is set up)
    # return 301 https://$host$request_uri;

    location /files/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

